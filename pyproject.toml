[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowmia"
version = "0.1.0"
description = "Membership-inference privacy evaluation framework for synthetic network flow data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Guilherme S. G. Brotto", email = "guilherme.silveiragomesbrotto@gmail.com" },
]
keywords = ["membership-inference", "privacy", "synthetic-data", "network-flows", "gan", "domias"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "torch>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
gpu = [
    "nvidia-cublas-cu12==12.8.4.1",
    "nvidia-cuda-cupti-cu12==12.8.90",
    "nvidia-cuda-nvrtc-cu12==12.8.93",
    "nvidia-cuda-runtime-cu12==12.8.90",
    "nvidia-cudnn-cu12==9.10.2.21",
    "nvidia-cufft-cu12==11.3.3.83",
    "nvidia-cufile-cu12==1.13.1.3",
    "nvidia-curand-cu12==10.3.9.90",
    "nvidia-cusolver-cu12==11.7.3.90",
    "nvidia-cusparse-cu12==12.5.8.93",
    "nvidia-cusparselt-cu12==0.7.1",
    "nvidia-nccl-cu12==2.27.5",
    "nvidia-nvjitlink-cu12==12.8.93",
    "nvidia-nvshmem-cu12==3.4.5",
    "nvidia-nvtx-cu12==12.8.90",
    "triton>=3.6",
]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "plotly>=6.0",
]
dev = [
    "pytest>=7.4",
]

[project.urls]
Repository = "https://github.com/guilherme751/FlowMIA"

[tool.setuptools.packages.find]
where = ["src"]
include = ["flowmia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
